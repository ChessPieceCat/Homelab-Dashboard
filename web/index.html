<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Homelab Dashboard</title>
    <link rel="stylesheet" href="/static/styles.css">
  </head>
  <body>
    <h1>Server Dashboard</h1>
    <div class="performance-metrics">
        <ul>
            <li>CPU: {{ .CPUUsage }}%</li>
            <li>Memory: {{ .MemoryUsage }}%</li>
            <li>Storage: {{ .StorageUsage }}%</li>
            <li>Uptime: {{ .Uptime }}</li>
        </ul>
    </div>

    <div class="containers">
      <h2>Containers</h2>
      <ul>
        {{ range .Statuses }}
          <li>{{ .Name }} Status: {{ .Status }} CPU: {{ .CPUUsage }}% Memory: {{ .MemoryUsage }}%</li>
        {{ end }}
      </ul>
    </div>
  </body>
</html>

name: Build

on:
    pull_request:
    push:
        branches:
            - main

permissions:
    contents: read

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-go@v5
              with:
                  go-version-file: ./go.mod

            - name: Download dependencies
              run: go mod download

            - name: Run tests
              run: go test ./...

            - name: Run vet
              run: go vet ./...

            - name: Build application
              run: go build -o app .

            - name: Build Docker image
              run: docker build -t homelab-dashboard .